<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .name { font-size: 32px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.6px; }
      .role { font-size: 14px; font-weight: 500; fill: #c9d1d9; }
      .bio { font-size: 13.5px; font-weight: 400; fill: #8b949e; }
      .label { font-size: 10.5px; font-weight: 600; fill: #7d8590; letter-spacing: 0.8px; }
      .cell-title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .cell-sub { font-size: 12.5px; font-weight: 400; fill: #8b949e; }
      .pill-text { font-size: 11.5px; font-weight: 500; fill: #8b949e; }
      .status-text { font-size: 11.5px; font-weight: 500; fill: #3fb950; }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect x="1" y="1" width="878" height="218" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1" />

  <!-- Vertical Divider -->
  <line x1="556" y1="28" x2="556" y2="192" stroke="#21262d" stroke-width="1" />

  <!-- Left Column: Identity -->
  <g transform="translate(36, 42)">
    <text x="0" y="24" class="sans name">Kevin Ding</text>

    <!-- Role Pill -->
    <rect x="192" y="5" width="222" height="24" rx="12" fill="#122117" stroke="#1f4429" stroke-width="1" />
    <circle cx="206" cy="17" r="3.5" fill="#3fb950" />
    <text x="217" y="21" class="sans status-text">SDE @ Amazon Prime Video</text>

    <text x="0" y="64" class="sans role">Full-Stack Software Engineer</text>
    <text x="0" y="88" class="sans bio">Building end-to-end web applications, distributed backend services,</text>
    <text x="0" y="107" class="sans bio">and interactive interfaces.</text>

    <!-- Focus Tags -->
    <g transform="translate(0, 128)">
      <rect x="0" y="0" width="154" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="12" y="16" class="mono pill-text">TS · React · Next.js</text>

      <rect x="164" y="0" width="152" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="176" y="16" class="mono pill-text">Java · Python · AWS</text>

      <rect x="326" y="0" width="142" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="338" y="16" class="mono pill-text">Postgres · Spark</text>
    </g>
  </g>

  <!-- Right Column: Education & Off the Clock -->
  <g transform="translate(588, 42)">
    <text x="0" y="10" class="mono label">EDUCATION</text>
    <text x="0" y="32" class="sans cell-title">Georgia Tech <tspan class="cell-sub">· M.S. CS (ML)</tspan></text>
    <text x="0" y="52" class="sans cell-title">UC Santa Cruz <tspan class="cell-sub">· B.S. CS</tspan></text>

    <line x1="0" y1="74" x2="256" y2="74" stroke="#21262d" stroke-width="1" />

    <text x="0" y="98" class="mono label">OUTSIDE OF WORK</text>
    <text x="0" y="120" class="sans cell-title">Bouldering · Calisthenics · Cooking</text>
    <text x="0" y="140" class="sans cell-sub">Reading · C-Dramas &amp; K-Dramas</text>
  </g>
</svg>
