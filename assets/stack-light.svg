<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .label { font-size: 12px; font-weight: 600; fill: #1f2328; }
      .tech { font-size: 12px; font-weight: 400; fill: #59636e; }
      .tech-hi { fill: #1f2328; font-weight: 600; }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="174" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
  <line x1="440" y1="20" x2="440" y2="156" stroke="#d8dee4" stroke-width="1" />
  <line x1="28" y1="88" x2="852" y2="88" stroke="#d8dee4" stroke-width="1" />

  <!-- Top Left: Frontend -->
  <g transform="translate(32, 34)">
    <text x="0" y="0" class="sans label">Frontend</text>
    <text x="0" y="22" class="mono tech"><tspan class="tech-hi">TypeScript · React · Next.js</tspan> · Tailwind CSS</text>
    <text x="0" y="40" class="mono tech">HTML5 Canvas · SVG · Phaser 3 · Angular</text>
  </g>

  <!-- Top Right: Backend -->
  <g transform="translate(468, 34)">
    <text x="0" y="0" class="sans label">Backend &amp; Systems</text>
    <text x="0" y="22" class="mono tech"><tspan class="tech-hi">Java · Python · Node.js</tspan> · Scala</text>
    <text x="0" y="40" class="mono tech">C++ · C# / .NET · REST &amp; Serverless APIs</text>
  </g>

  <!-- Bottom Left: Data & Cloud -->
  <g transform="translate(32, 118)">
    <text x="0" y="0" class="sans label">Data &amp; Cloud</text>
    <text x="0" y="22" class="mono tech"><tspan class="tech-hi">AWS · PostgreSQL · DynamoDB</tspan> · Supabase</text>
    <text x="0" y="40" class="mono tech">Apache Spark · Drizzle ORM · Docker · Linux</text>
  </g>

  <!-- Bottom Right: ML & Testing -->
  <g transform="translate(468, 118)">
    <text x="0" y="0" class="sans label">ML, Data Science &amp; Testing</text>
    <text x="0" y="22" class="mono tech"><tspan class="tech-hi">PyTorch · scikit-learn</tspan> · Pandas · NumPy</text>
    <text x="0" y="40" class="mono tech">SciPy · TensorFlow · Vitest · Playwright</text>
  </g>
</svg>
